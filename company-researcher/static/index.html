<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Researcher Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22 fill=%22none%22><circle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23070a14%22 stroke=%22%231d9bf0%22 stroke-width=%222%22/><path d=%22M13 10l7 6-7 6%22 stroke=%22%231d9bf0%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
</head>
<body>
  <div class="app" id="appRoot" data-state="empty">
    <!-- Slim Header (revealed in active chat state) -->
    <header class="app-header" id="appHeader" role="banner">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" stroke="#1d9bf0" stroke-width="2"></circle>
              <path d="M20 20L16 16" stroke="#1d9bf0" stroke-width="2" stroke-linecap="round"></path>
              <circle cx="11" cy="11" r="2.5" fill="#38bdf8"></circle>
            </svg>
          </div>
          <span class="header-title">Company Researcher</span>
          <span id="activeCompanyBadge" class="header-badge" style="display: none;" aria-live="polite"></span>
        </div>

        <div class="header-right">
          <button id="resetBtn" class="btn-ghost" type="button" aria-label="Start a new chat session" title="Start a new chat session">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
              <path d="M21 3v5h-5"></path>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
              <path d="M3 21v-5h5"></path>
            </svg>
            <span>New chat</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Scrollable Center Workspace -->
    <div class="content-scroll" id="contentScroll">
      <div class="column-container">
        <!-- Hero Section (Visible in Empty State) -->
        <section class="hero-section" id="heroSection" aria-label="Introduction">
          <div class="hero-logo-badge" aria-hidden="true">
            <div class="hero-glow-ring"></div>
            <svg class="hero-mark" viewBox="0 0 36 36" width="36" height="36" fill="none">
              <circle cx="16" cy="16" r="11" stroke="#1d9bf0" stroke-width="2.75"></circle>
              <path d="M24 24L31 31" stroke="#38bdf8" stroke-width="2.75" stroke-linecap="round"></path>
              <!-- Sparkles on logo mark -->
              <path d="M16 9v4M14 11h4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"></path>
              <circle cx="16" cy="16" r="3.5" fill="#1d9bf0"></circle>
            </svg>
          </div>
          <h1 class="hero-title">Company Researcher</h1>
          <p class="hero-tagline">Paste a company website. Get a clear summary in seconds.</p>
        </section>

        <!-- Message Feed (Visible in Active Chat) -->
        <main class="messages-feed" id="messagesFeed" role="log" aria-live="polite" aria-label="Research Conversation">
          <!-- Dynamically populated messages and structured report cards -->
        </main>

        <!-- Typing Indicator Card -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;" aria-live="polite">
          <div class="typing-avatar" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none">
              <circle cx="9" cy="9" r="6" stroke="#1d9bf0" stroke-width="2"></circle>
              <path d="M14 14l3.5 3.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </div>
          <div class="typing-content">
            <div class="dots-pulse" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <span class="typing-label" id="typingText">Reading the website...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Floating Jump to Latest Button -->
    <button id="jumpToBottomBtn" class="jump-to-bottom" style="display: none;" type="button" aria-label="Jump to latest message">
      <span>Jump to latest</span>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M19 12l-7 7-7-7"></path>
      </svg>
    </button>

    <!-- Docked Input Section -->
    <div class="dock-container" id="dockContainer">
      <div class="dock-fade" aria-hidden="true"></div>
      
      <div class="dock-inner">
        <form class="signature-form" id="chatForm">
          <!-- Signature Input Bar -->
          <div class="signature-bezel" id="signatureBezel">
            <!-- Left glowing cyan-blue accent -->
            <div class="bezel-glow-accent" aria-hidden="true"></div>

            <!-- Inner field container -->
            <div class="signature-field">
              <textarea
                id="messageInput"
                class="signature-textarea"
                rows="1"
                maxlength="2000"
                placeholder="Ask me anything..."
                aria-label="Ask me anything or paste a company website URL"
                required
              ></textarea>

              <button
                type="submit"
                id="sendBtn"
                class="signature-send-btn"
                aria-label="Send message"
              >
                <!-- Paper-plane icon with 2 blue four-point sparkles at top right -->
                <svg class="send-plane-svg" viewBox="0 0 32 28" width="22" height="20" fill="none" aria-hidden="true">
                  <!-- Paper-plane outline -->
                  <path class="plane-body" d="M3 13.5L24 3L13.5 24L10 16.5L3 13.5Z" stroke="#f1f5f9" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                  <path class="plane-fold" d="M10 16.5L24 3" stroke="#f1f5f9" stroke-width="1.8" stroke-linecap="round"/>
                  
                  <!-- Sparkle 1 (larger, top-right) -->
                  <path class="sparkle sparkle-1" d="M26.5 0.5C26.5 2.2 27.8 3.5 29.5 3.5C27.8 3.5 26.5 4.8 26.5 6.5C26.5 4.8 25.2 3.5 23.5 3.5C25.2 3.5 26.5 2.2 26.5 0.5Z" fill="#38bdf8"/>
                  <!-- Sparkle 2 (smaller, slightly offset) -->
                  <path class="sparkle sparkle-2" d="M21 4.5C21 5.6 21.9 6.5 23 6.5C21.9 6.5 21 7.4 21 8.5C21 7.4 20.1 6.5 19 6.5C20.1 6.5 21 5.6 21 4.5Z" fill="#0ea5e9"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Suggestion Chips (Visible below input bar in Empty State) -->
          <div class="chips-row" id="chipsRow" aria-label="Suggested company websites">
            <button type="button" class="chip-ghost" data-url="stripe.com" aria-label="Research stripe.com">
              <span class="chip-dot" aria-hidden="true"></span>
              <span>stripe.com</span>
            </button>
            <button type="button" class="chip-ghost" data-url="daraz.pk" aria-label="Research daraz.pk">
              <span class="chip-dot" aria-hidden="true"></span>
              <span>daraz.pk</span>
            </button>
            <button type="button" class="chip-ghost" data-url="systemsltd.com" aria-label="Research systemsltd.com">
              <span class="chip-dot" aria-hidden="true"></span>
              <span>systemsltd.com</span>
            </button>
          </div>
        </form>

        <footer class="dock-disclaimer">
          Answers come only from the company's public website and may be incomplete.
        </footer>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
